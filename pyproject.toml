[project]
name="preentrega7-api-agente"
version="0.2.0"
description="API FastAPI asíncrona para LangGraph con Redis, HITL y Phoenix"
readme="README.md"
requires-python=">=3.12"
dependencies=[
"arize-phoenix-otel>=0.17.0",
"chromadb>=0.5.0",
"fastapi>=0.115.0",
"langchain>=0.3.0",
"langchain-chroma>=0.1.0",
"langchain-community>=0.3.0",
"langchain-core>=0.3.0",
"langchain-google-genai>=2.0.0",
"langchain-groq>=0.2.0",
"langchain-huggingface>=0.1.0",
"langgraph>=0.2.0",
"langgraph-checkpoint-redis>=0.1.0",
"openinference-instrumentation-langchain>=0.1.70",
"opentelemetry-exporter-otlp-proto-http>=1.20.0",
"opentelemetry-sdk>=1.20.0",
"pydantic>=2.0.0",
"python-dotenv>=1.0.0",
"redis>=5.0.0",
"sentence-transformers>=3.0.0",
"uvicorn[standard]>=0.30.0",
]
[dependency-groups]
dev=["httpx>=0.27.0"]
[build-system]
requires=["hatchling"]
build-backend="hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    'app',
    'agents',
    'graph.py',
    'state.py',
    'supervisor.py',
    'logger.py',
    'llm.py',
    'tracing.py',
    'rag.py',
    'ingest.py',
]

